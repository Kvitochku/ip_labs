</head>
<body>

  <header>
    <h1>Зворотний зв’язок</h1>
    <p>Маєте запитання або хочете поділитися своєю історією подорожей? Напишіть нам!</p>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Головна</a></li>

  <main>
    <form action="#" method="post">
      <label for="username">Ваше ім’я:</label>
      <input type="text" id="username" name="username" placeholder="Введіть ваше ім'я" required>

      <label for="useremail">Електронна пошта:</label>
      <input type="email" id="useremail" name="useremail" placeholder="example@mail.com" required>

      <label for="subject">Тема повідомлення:</label>
      <input type="text" id="subject" name="subject" placeholder="Тема вашого листа" required>

      <label for="message">Повідомлення:</label>
      <textarea id="message" name="message" rows="5" placeholder="Напишіть нам своє повідомлення..." required></textarea>

      <button type="submit">Надіслати повідомлення</button>
    </form>
  </main>
