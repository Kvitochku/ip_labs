<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student card FORM</title>
</head>
<body>

  <header>
    <h1>Student card FORM</h1>
  </header>

  <main>
    <form action="submit.php" method="post" enctype="multipart/form-data">
      
      <section>
        <h2>Personal Information</h2>
        <fieldset>
          <legend>Provide your details</legend>
          
          <p>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
          </p>

          <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </p>

          <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter a password" required minlength="6">
          </p>

          <p>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="16" max="100">
          </p>

          <p>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
          </p>

          <fieldset>
            <legend>Gender:</legend>
            <label><input type="radio" name="gender" value="male"> Male</label><br>
            <label><input type="radio" name="gender" value="female"> Female</label><br>
            <label><input type="radio" name="gender" value="other"> Other</label>
          </fieldset>
          <br>

          <fieldset>
            <legend>Languages Known:</legend>
            <label><input type="checkbox" name="languages" value="english"> English</label><br>
            <label><input type="checkbox" name="languages" value="spanish"> Spanish</label><br>
            <label><input type="checkbox" name="languages" value="french"> French</label>
          </fieldset>
          <br>

          <p>
            <label for="country">Country:</label>
            <select id="country" name="country">
              <option value="" disabled selected>Select your country</option>
              <option value="ua">Ukraine</option>
              <option value="pl">Poland</option>
              <option value="uk">United Kingdom</option>
              <option value="us">United States</option>
            </select>
          </p>
        </fieldset>
      </section>

      <section>
        <h2>College Subjects</h2>
        <fieldset>
          <legend>Select your subjects</legend>
          
          <p>
            <label for="subjects">Choose subjects:</label><br>
            <select id="subjects" name="subjects" multiple size="5">
              <option value="math">Mathematics</option>
              <option value="cs">Computer Science</option>
              <option value="physics">Physics</option>
              <option value="chemistry">Chemistry</option>
              <option value="english">English</option>
            </select>
          </p>

          <p>
            <label for="cs-interest">Rate your interest in Computer Science:</label><br>
            <input type="range" id="cs-interest" name="cs_interest" min="1" max="10" value="8">
          </p>
        </fieldset>
      </section>

      <section>
        <h2>Skills Assessment</h2>
        <fieldset>
          <legend>Assess your skills</legend>
          
          <p>
            <label for="skills">Describe your skills:</label><br>
            <textarea id="skills" name="skills" rows="5" cols="45" placeholder="List your skills here..."></textarea>
          </p>

          <p>
            <label for="resume">Upload your resume:</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
          </p>

          <p>
            <label for="favcolor">Pick your favorite color:</label>
            <input type="color" id="favcolor" name="favcolor" value="#000000">
          </p>

          <p>
            <label for="studytime">Preferred study time:</label>
            <input type="time" id="studytime" name="studytime">
          </p>

          <p>
            <input type="submit" value="Submit Survey">
          </p>
        </fieldset>
      </section>

    </form>
  </main>

  <footer>
    <p>Student card by Maxym SOSNYLO TK-41. All rights reserved.</p>
  </footer>

</body>
</html>
