<body class="fontyourface path-frontpage">

              <div class="views-view-grid horizontal cols-2 clearfix">

                <div class="row">
                  <div class="col-12 col-sm-6 views-col col-1">
                    <div>
                      <a href="https://lpnu.ua/news/zvit-rektora-pro-osnovni-dosiahnennia-lvivskoi-politekhniky-u-2025-rotsi-na-konferentsii" target="_blank" rel="noopener noreferrer">
                        <img src="img/lpfasad.jpg" width="720" height="360" alt="Фасад головного корпусу Львівської політехніки" class="img-responsive" />
                        <div class="shadow_featured"></div>
                        <h2><span>Звіт ректора про основні досягнення Львівської політехніки у 2025 році на Конференції трудового колективу Університету</span></h2>
                      </a>
                    </div>
                  </div>

                  <div class="col-12 col-sm-6 views-col col-2">
                    <div>
                      <a href="https://lpnu.ua/news/instytuty-dosiahnennia-plany-motyvatsiia-tematychnyi-nomer-zhurnalu-lvivska-politekhnika" target="_blank" rel="noopener noreferrer">

                        <div class="shadow_featured"></div>
                        <h2><span>Інститути – досягнення, плани, мотивація: тематичний номер журналу «Львівська політехніка»</span></h2>
                      </a>
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-12 col-sm-6 views-col col-1">
                    <div>
                      <a href="https://lpnu.ua/news/politekhnika-ekskursiina" target="_blank" rel="noopener noreferrer">
                        <img src="img/zobrazhennyaviber2024-07-1515-03-24-090.jpg" width="720" height="360" alt="Інтер’єр історичної будівлі Львівської політехніки" class="img-responsive" />

                        <h2><span>Політехніка екскурсійна</span></h2>
                      </a>
                    </div>
                  </div>

                  <div class="col-12 col-sm-6 views-col col-2">
